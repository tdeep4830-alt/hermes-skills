services:
  db:
    # 版本盡量對齊你 Supabase project 用緊嘅 Postgres 版本
    # (Supabase Dashboard -> Project Settings -> Infrastructure 度睇到)
    # 用 pgvector/pgvector 呢個 image 嚟代替官方 postgres image：
    # 佢係 postgres:15 加預裝咗 pgvector extension，等本地開發環境同 Supabase（內建 pgvector）睇齊。
    image: pgvector/pgvector:pg15
    container_name: stock_news_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock_news_db
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

# 用法：
#   docker compose up -d          # 起本地 PostgreSQL
#   docker compose down           # 停止
#   docker compose down -v        # 停止並清空資料
