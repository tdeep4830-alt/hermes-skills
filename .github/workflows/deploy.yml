name: Deploy Skills to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 第一步：驗證 Skills 格式 ──
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/hermes_test
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY-OPEN_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY-OPEN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Enable pgvector extension
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d hermes_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations
        working-directory: scripts/financial_assist_agent/financial_news_article
        run: alembic upgrade head

      - name: Validate skills
        run: python tests/validate_skills.py

      - name: Run tests
        run: pytest tests/ -v

  # ── 第二步：部署到 VPS ──
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/my-hermes-skills
            git pull origin main
            python3 scripts/deploy_skills.py
            echo "✅ Deploy complete"